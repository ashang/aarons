# beam-thickness=1.5


# ==============================================================================
# Catppuccin 是 GitHub 上最受欢迎的主题体系，它的深色模式（Mocha）像丝绒一样柔和，浅色模式（Latte）清晰而不刺眼。
# htop 看系统资源、git diff 看代码变更、systemctl status 看报错，红绿黄蓝的颜色语义在两种模式下都保持了高度的一致性。
# 当系统切换深浅色主题时，foot 会自动在这两个配置块之间切换
# ==============================================================================

# 语义化色彩：
#   严格的色彩语义学（红色=错误/警告，绿色=成功，黄色=提示，蓝色=链接/高亮），并且在长时间注视代码时对比度适中，极度护眼。
#   regular6 (青色) 被特意保留为柔和的青色。终端中大量的 IP 地址、网络接口名 (eth0)、容器 ID 通常会被语法高亮为青色。这个颜色在深色背景下清晰且不刺眼。
#   regular1 (红色) 和 regular3 (黄色) 的饱和度经过调整，用于显示编译错误 (C++/Go) 或警告时，不会像传统终端那样产生“视觉灼烧感”。
# 完美的 Dark/Light 配对：
#   浅色模式 (Latte) 并不是简单地把深色模式的颜色反相。它的背景是柔和的灰白色 (eff1f5)，而文字是深灰蓝色 (4c4f69)，避免了纯白 (#FFFFFF) 和纯黑 (#000000) 带来的极端对比度疲劳。
# Foot 原生自动切换：
#   只要你的桌面环境支持并开启了“自动深色/浅色模式”，foot 检测到系统主题变化时，会自动在 [colors-dark] 和 [colors-light] 之间无缝切换，无需你手动修改配置文件。

[colors-dark]
# 0.0 完全透明，1.0 完全不透明。0.9 到 0.95 是最佳实践，能隐约看到背后的窗口
alpha=0.92

# Catppuccin Mocha
# --- 基础颜色 ---
foreground=cdd6f4
background=1e1e2e

# --- 选择(高亮)颜色 ---
# 当鼠标选中文本时，文本和背景的颜色
selection-foreground=cdd6f4
# 使用 Catppuccin 的 Surface 1 颜色作为选中背景，柔和且不刺眼
selection-background=45475a 

## Normal/regular colors (color palette 0-7)
regular0=45475a  # Black (Surface 1)
regular1=f38ba8  # Red (Error/Danger)
regular2=a6e3a1  # Green (Success)
regular3=f9e2af  # Yellow (Warning)
regular4=89b4fa  # Blue (Info/Links)
regular5=f5c2e7  # Pink (Magenta/Highlights)
regular6=94e2d5  # Teal (Cyan)
regular7=bac2de  # White (Subtext 1)

#regular1=f38ba8  # 红色 (错误/删除)
#regular2=a6e3a1  # 绿色 (成功/字符串)
#regular3=f9e2af  # 黄色 (警告/关键字)
#regular4=89b4fa  # 蓝色 (路径/函数)
#regular5=f5c2e7  # 洋红 (特殊强调)
#regular6=94e2d5  # 青色 (网络/容器相关)
#regular7=bac2de  # 白色 (普通文本)

## Bright colors (color palette 8-15)
bright0=585b70   # Bright Black (Surface 2)
bright1=f38ba8   # Bright Red
bright2=a6e3a1   # Bright Green
bright3=f9e2af   # Bright Yellow
bright4=89b4fa   # Bright Blue
bright5=f5c2e7   # Bright Pink
bright6=94e2d5   # Bright Teal
bright7=a6adc8   # Bright White (Subtext 0)

[colors-light]
# Catppuccin Latte (浅色模式 - 适合强光环境或打印)
foreground=4c4f69
background=eff1f5

# 浅色模式下，背景本身较亮，透明度可以稍微低一点，或者保持一致
