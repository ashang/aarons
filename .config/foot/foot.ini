# -*- conf -*-
# vim: ft=dosini

# Alacritty and kitty use way too much RAM, and termite is no longer maintained

[main]
# 选中即复制。在 Wayland 下，建议 clipboard
# 在 foot 中，控制选中复制目标的选项是 selection-target
selection-target=both
# 可选值: 
#   primary   (默认)：仅复制到 Primary Selection (需用鼠标中键粘贴)
#   clipboard：仅复制到系统剪贴板 (需用 Ctrl+V 粘贴)
#   both     (推荐)：同时复制到两者，兼顾传统 Linux 习惯和现代 Ctrl+V 习惯

# primary selection
# clipboard
# pad=0x0                             # optionally append 'center'
# pad=15x15
pad=10x10 center  # 终端边缘留白，让界面更呼吸感


# shell=$SHELL (if set, otherwise user's default shell from /etc/passwd)
# login-shell=no

# term=foot (or xterm-256color if built with -Dterminfo=disabled)
## avoid errors on remote systems when using less etc when the foot
# terminfo is not available.
