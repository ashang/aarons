#Before tmux 1.9, styles (the colours and attributes of various things) were each configured
#  with three options - one for the foreground colour (such as mode-fg), one for the
#  background (such as mode-bg) and one for the attributes (such as mode-attr).
#In tmux 1.9 each set of three options were combined into a single option (so mode-fg,
#  mode-bg and mode-attr became mode-style) and in tmux 2.9 the old options were removed.

# dark-gray
set -g status-style bg=#1e1e2e,fg=#cdd6f4
# set -g window-status-format "#[fg=grey]#I:#W"
# set -g window-status-current-format "#[fg=black,bg=cyan]#I:#W"
#set -g mode-style bg=red,fg=green,blink
#set -g mode-style bg=yellow,fg=black
set -g mode-style bg=#f9e2af,fg=#1e1e2e,bold
## message text
#set-option -g message-style bg=colour235,fg=colour166 # bg=base02, fg=orange
#set-option -g message-command-style fg=black,bg=yellow
set -g message-style fg=#cdd6f4,bg=#313244
set -g message-command-style fg=#1e1e2e,bg=#f38ba8,bold


