# 在使用mouse选择的同时，按下 alt键，使鼠标选择文字进行系统的拷贝缓冲，而不是 tmux的拷贝缓冲

# マウス操作切替
# mouse mode’s enabled the system clipboard and primary selection no longer work at all:
# Selecting text by clicking and dragging doesn’t copy it into the primary selection, and
#  your selection disappears as soon as you release the mouse button
# Double-clicking and triple-clicking to select words and lines no longer works (it does
#  select the word or line if you manually enter tmux’s copy mode first, but still doesn’t copy
#  it into the system clipboard)
# set -g mouse off

#set -g mouse on : equals to the following 4 options
#set -g mouse-resize-pane on
#set -g mouse-resize-pane on
#set -g mouse-select-pane on
#set -g mouse-select-window on

## Mouse
## Turn the mouse on, but without copy mode dragging
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# toggle mouse
bind m run "cut -c3- '#{TMUX_CONF}' | sh -s _toggle_mouse"

# マウス操作を有効にする
#bind m set -g mouse on \; display "Mouse: ON"
#bind m set -g mouse on \; display "Mouse: ON"
#bind m set -g mouse on \; display "Mouse: ON"
bind M set -g mouse off \; display "Mouse: OFF"

## Toggle mouse mode to enable mouse copy paste
bind c \
    set -g mode-mouse on \;\
    display 'Mouse: ON'

## set mouse off with prefix
bind C \
    set -g mode-mouse off \;\
    display 'Mouse: OFF'

# zoom this pane to full screen
bind z \
    new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read' \;\
    swap-pane -s tmux-zoom.0 \;\
    select-window -t tmux-zoom
# restore this pane
bind Z \
    last-window \;\
    swap-pane -s tmux-zoom.0 \;\
    kill-window -t tmux-zoom

set -g renumber-windows on
