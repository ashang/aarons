if-shell "command -v xclip &>/dev/null" {
  bind -T copy-mode    C-c send -X copy-pipe-no-clear "xclip -in -sel clipboard"
  bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "xclip -in -sel clipboard"
  bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# bind C-c run "tmux save-buffer - | xclip -i -sel clipboard > /dev/null"
  bind C-c run "tmux show-buffer | xclip -i -sel clipboard"
  bind C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"
}

if-shell "command -v xsel &>/dev/null" {
  bind -T copy-mode    C-c send -X copy-pipe-no-clear "xsel -i --clipboard"
  bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "xsel -i --clipboard"
  bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xsel -i --clipboard'
  bind C-c run "tmux show-buffer | xsel -i -b"
  #bind C-v run "tmux set-buffer -- \"$(xsel -o -b)\"; tmux paste-buffer"
  bind C-v run "tmux set-buffer \"$(xsel -o -b)\"; tmux paste-buffer"
}

if-shell "! command -v xclip &>/dev/null && ! command -v xsel &>/dev/null " {
  bind -T copy-mode    C-c send -X copy-pipe-no-clear "tmux show-buffer"
  bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "tmux show-buffer"
  bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'tmux show-buffer'

  bind C-c run "tmux show-buffer"
  bind C-v run "tmux set-buffer \"$(tmux show-buffer)\"; tmux paste-buffer"
  bind C-v run "tmux display-message 'xclip or xsel not found. Using tmux buffer only.'"
}

