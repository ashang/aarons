#The "transparent" feature relies upon the applications which run in the
#terminal to not explicitly set the background color. In particular, when
#clearing the background, these applications should not set the color. That
#corresponds to a terminal feature known as back color erase, or bce.

#If you have issues scrolling with Shift-Page Up/Down in your terminal, the following will remove the smcup and rmcup capabilities for any term that reports itself as anything beginning with xterm:
set-option -ga terminal-overrides ',xterm*:smcup@:rmcup@'
#This tricks the terminal emulator into thinking Tmux is a full screen application like pico or mutt[2], which will make the scrollback be recorded properly. Beware however, it will get a bit messed up when switching between windows/panes. Consider using Tmux's native scrollback instead.

#The TERM=screen-256color entry tells applications that they have to set the
#color when clearing the display (to ensure that the current color is used).
#There is a different terminal description screen-256color-bce which would do
#what you want in this case.

