# A clean tmux status bar is about signal density + low distraction—you want quick situational awareness (sessions, windows, host, load, git, time) without clutter.

# Enable status bar
# set -g status on
# set -g status-interval 2

# Colors (minimal, readable)
# https://github.com/seebi/tmux-colors-solarized/blob/master/tmuxcolors-256.conf
# set-option -g status-style bg=#1e1e2e,fg=#cdd6f4
set-option -g status-style bg=colour235,fg=colour136,default # bg=base02, fg=yellow

# LEFT: session + window list
#set -g status-left-length 120
#set -g status-left "#[fg=#89b4fa,bold]#S #[fg=#6c7086]| "
#set-option -g status-left-style default
set -g status-left "#[fg=cyan,bold]#S #[fg=gray]| "
set-option -ag status-left 'W%V.%u #[default]%Y-%m-%d #{online_status} '

# `prefix + I` (capital i, as in **I**nstall) to fetch and source plugins.
set -g @plugin 'tmux-plugins/tpm'

# Automatic tpm installation
if "test ! -d ~/.config/tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-sensible'

# RIGHT: system info + time
#set-option -g status-right-length 220

# #{battery_percentage}
# set -g status-right "\ #[fg=#89b4fa]#H \ [fg=#f38ba8]%H:%M "
# set -g status-right "#(git rev-parse --abbrev-ref HEAD 2>/dev/null) | %H:%M"

set-option -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse],}#{=108:pane_title} #(curl icanhazip.com) #{cpu_percentage} | #{ram_percentage} | #[fg=magenta]%H:%M #[fg=#f9e2af]CPU: #(top -l 1 | awk '/CPU usage/ {print $3}') #[fg=#a6e3a1]RAM: #(vm_stat | awk '/free/ {print $3}') #[fg=#89b4fa]#(whoami)@#H"
set-option -ag status-right " #[fg=yellow]ns:#(ip netns identify $$ 2>/dev/null || echo host) #[fg=magenta]load:#(uptime | awk -F'load average:' '{print $2}' | cut -d, -f1)"


# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
# run -b for background
run-shell -b '~/.config/tmux/plugins/tpm/tpm'

#[fg=#{?#{==:#{pane_current_command},ip},red,green}]
