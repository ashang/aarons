#Set the Prefix key
#`prefix` is using <kbd>C-b</kbd>, by default

## Issues with C-a as `prefix`
## - picocom/minicom for escape by C-a
## - vim to increase a number on the current line (default ?? no)
## - bash emacs mode

# Ctrl+b (Ctrl plus b) in Vim is `:scrollback 1`
# You can use `Ctrl+u` (Ctrl plus u) `:scrollback 1.5` for alternate

# Ctrl+b is to move the cursor backward by one char in readline
# No alternate now, you can try `Alt-b`, `Ctrl-h`, `Ctrl-f`, `Alt-f`
# Confiture also in `inputrc` files

## C-x? NO if you use Emacs, nano, etc.

# If running inside tmux ($TMUX is set), then change the status line to red
%if #{TMUX}
    set -g status-bg red
%endif

# No bells at all
set -g bell-action none

## TODO: lock-server
## lockscreen
# locking after 30 minutes of inactivity:
set -g lock-after-time 1800

# clock
set-window-option -g clock-mode-colour green #green

## Change the prefix key to C-a
### This means also to unbind the default
#set-option -g prefix C-a

# use 'PREFIX, KEY, <command>' to send commands to a TMUX session inside another TMUX session
bind-key b   send-prefix

## twice for one
### move backward one char in bash emacs mode
bind-key C-b send-keys 'C-b'
### move to beginning of line in bash emacs mode
bind-key C-a send-keys 'C-a'

# Backup prefix key: prefix2
# The default value for prefix2 is none, meaning it is not set by default
set-option -g prefix2 C-a
#set-option -g prefix2 M-b
#set-option -g prefix2 M-a
# prefixキーをC-\に変更する
#bind C-\\ send-prefix -2
# set -g prefix2 C-\\

# Interrupt (SIGQUIT): In many terminal emulators, pressing Ctrl + \ sends a quit signal to the currently running process in the terminal. This is similar to Ctrl + C, but it generates a core dump in addition to terminating the process.
# Detach Session: If you are using terminal multiplexers like GNU Screen or tmux, Ctrl + \ might be used to detach from the current session.

# options
set -g @TMUX_CONF "~/.config/tmux/tmux.conf"
# tmux show-options -g | grep status

# reload configuration
# 設定ファイルを  リロードする
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloading..."

## Key Binding {{{
#unbind -a  #unbind all the keys

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab  switch-client -l  # move to last session
bind S-Tab switch-client -l  # move to last session

# 直前の画面に移動
bind C-Tab   run "tmux last-pane || tmux last-window || tmux new-window"
bind -n M-\; run "tmux last-pane || tmux last-window || tmux new-window"

# Keys are bound in a key table. By default (without -T), the key is bound in the prefix key table.
# The root table is used for keys pressed without the prefix key:
# Use -n (a shortcut for -T root) to bind keys in this table.

# Keys may also be bound in custom key tables and the switch-client -T command to switch
# -N attaches a note to the key (shown with list-keys -N).
# -r indicates this key may repeat, see the repeat-time option.

## for repeatable keys
#set -sg repeat-time 600                   # increase repeat timeout
#set-option -g repeat-time 1000
# }}}

# ウィンドウ履歴の最大行数
# Scroll buffer. Default is 2000
set-option -g history-limit 300000

# xterm-style function key sequences
# 矢印キーでペインを移動する
# If set, tmux will generate xterm(1) -style function key sequences; these have a number included to
# indicate modifiers such as Shift, Alt or Ctrl
## makes eg. Ctrl+Arrow navigate words
set-window-option -g xterm-keys on

# Pane movement
# ウィンドウ選択
bind -n M-V               choose-window 'join-pane -h -s "%%"'
bind -n M-|               choose-window 'join-pane -h -s "%%"'

bind J command-prompt -p "Join pane from:" "join-pane -s '%%'"
bind S command-prompt -p "Send pane to:" "join-pane -t '%%'"
# join-pane [-bdhv] [-l size | -p percentage] [-s src-pane] [-t dst-pane]
# (alias: joinp)
# Like split-window, but instead of splitting
# dst-pane and creating a new pane, split it and
# move src-pane into the space. This can be used
# to reverse break-pane.
# the full path takes 2 arguments: window_number.pane_number

# Set a pane option with -p, a window option with -w, a server option with -s, otherwise a session option.
# If the option is not a user option, -w or -s may be unnecessary - tmux will infer the type from the option name, assuming -w for pane options.
# If -g is given, the global session or window option is set.

#bind -n C-` run -b "tmux-switch-pane.sh"
#bind -n C-` run -b "tmux-switch-pane.sh"
#bind -n C-` run -b "tmux-switch-pane.sh"
#bind -n C-` run -b "tmux-switch-pane.sh"

## set window and pane index to 1 (0 by default)
## ウィンドウのインデックスを1から始める
## ペインのインデックスを1から始める
## 1, 2 and 3 are closer together than 0, 1 and 2

# make the first window number start at 1
set-option -g base-index 1

