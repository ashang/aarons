# --ozone-platform-hint=wayland 
--ozone-platform-hint=auto
# Running natively on Wayland provides smoother scrolling, better handling of HiDPI/scaling monitors, and lower resource overhead compared to running through the older XWayland compatibility layer.

# --enable-features=WaylandWindowDecorations 
# Forces Chrome to draw its own window title bars and borders, or allows the Wayland compositor to handle them properly depending on desktop environment settings.
# On some desktop environments, running natively on Wayland can cause window borders to disappear or look out of place. This flag ensures window controls (minimize, maximize, close) render correctly.

# --enable-features=WebRTCPipeWireCapturer 
# Enables screen and window sharing in WebRTC (used for apps like Discord, Google Meet, Zoom, etc.) using **PipeWire**.
# Wayland handles privacy and security differently than X11, preventing apps from secretly recording your screen. PipeWire is the modern Linux framework that allows secure, granular screen sharing on Wayland (letting you choose a specific window, tab, or your whole screen).

# --force-dark-mode
# Forces Chrome's user interface and compatible websites to render in dark mode.
# Ensures a consistent dark theme across the browser and web content, even if the system-wide theme doesn't automatically trigger it in certain web apps.
