# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.

#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

### MY PROGRAMS ###

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$editor      = geany
$browser     = brave

$menu = wofi --show drun

### ENVIRONMENT VARIABLES ###

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = WLR_NO_HARDWARE_CURSORS,1

### LOOK AND FEEL ###

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general

# Elements -------------------------------------------------
$hypr_border_size = 0
$hypr_gaps_in = 1
$hypr_gaps_out = 0
$hypr_rounding = 0

# Colors -------------------------------------------------
$gradient_angle = 45deg
$active_border_col_1 = 0xFFB4A1DB
$active_border_col_2 = 0xFFD04E9D
#$inactive_border_col_1 = 1e2030
#$inactive_border_col_2 = 1e2030
$active_shadow_col = 0x66000000
$inactive_shadow_col = 0x66000000
$group_border_col = 0xFFDB695B
$group_border_active_col = 0xFF4BC66D

#-- Input: Keyboard, Mouse, Touchpad ---------------------------
input {
	kb_model =
	#kb_layout = fr,us
	kb_layout = us
	kb_variant =
	#kb_options = grp:alt_shift_toggle
	kb_rules =
	kb_file =
	numlock_by_default = false
	repeat_rate = 25
	repeat_delay = 600
	sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
	accel_profile = adaptive
	force_no_accel = false
	left_handed = false
	scroll_method = 2fg
	scroll_button = 0
	natural_scroll = false
	follow_mouse = 1
	float_switch_override_focus = 1
	touchpad {
		disable_while_typing = true
		natural_scroll = true
		scroll_factor = 1.0
		middle_button_emulation = false
		clickfinger_behavior = false
		tap-to-click = true
		drag_lock = false
	}
	touchdevice {
		transform = 0
		output =
	}

# https://wiki.hyprland.org/Configuring/Variables/#input
}

#-- General ----------------------------------------------------
general {
	border_size = $hypr_border_size
	#no_border_on_floating = false
	gaps_in = $hypr_gaps_in
	gaps_out = $hypr_gaps_out
	#col.active_border = $active_border_col_1 $active_border_col_2 $gradient_angle
	#col.active_border = $active_border_col_1 $active_border_col_2 $gradient_angle
	#col.inactive_border = $inactive_border_col_1 $inactive_border_col_2 $gradient_angle
	#col.inactive_border = $inactive_border_col_1 $inactive_border_col_2 $gradient_angle
	#cursor_inactive_timeout = 30
	layout = dwindle
	#no_cursor_warps = false
#	apply_sens_to_raw = false
	#col.group_border = $group_border_col
	#col.group_border_active = $group_border_active_col

    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

# https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    #drop_shadow = true
    #shadow_range = 2
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
#-- Decoration -------------------------------------------------
decoration {
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 2
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
#-- Animations -------------------------------------------------
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
	animation = fadeIn,1,8,default
	animation = fadeOut,1,8,default
	animation = fadeSwitch,1,8,default
	animation = fadeShadow,1,8,default
	animation = fadeDim,1,8,default
    animation = workspaces, 1, 6, default

	animation = windowsIn,1,5,default,popin 0%
	animation = windowsMove,1,5,default,slide
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#-- Layout : Master --------------------------------------------
master {
	special_scale_factor = 0.8
	# new_is_master = true
	new_on_top = false
	#no_gaps_when_only = false
	#no_gaps_when_only = false
	#no_gaps_when_only = false
	orientation = left
	#inherit_fullscreen = true

    new_status = master
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

### KEYBINDINGSS ###

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# -- Terminal --
#bind = $mainMod, Q, exec, $terminal -- STOCKED
#bind = $mainMod, ENTER, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal

bind = SUPER_SHIFT, Return, exec, $term -f
bind = SUPER_ALT,   Return, exec, $term -s

#bind = $mainMod, T, exec, $term -F
#bind = $mainMod, T, exec, kitty -1
bind = $mainMod, T, exec, kitty --single-instance

# -- Hyprland --
bind = CTRL_ALT,    Delete, exit,

#bind = $mainMod, F, focuswindow,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, F, exec, $notifycmd 'Fullscreen Mode'

bind = SUPER,       Space,  centerwindow,

bind = $mainMod, C, killactive,

bind = $mainMod, E, exec, $fileManager

bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# dwindle
bind = SUPER,       S,      pseudo,
bind = SUPER,       S,      exec, $notifycmd 'Pseudo Mode'

# bind = $mainMod, J, togglesplit, # dwindle -- STOCKED
# bind = $mainMod, SPACE, togglesplit, # dwindle
# bind = $mainMod, SPACE, togglesplit, # dwindle
# bind = $mainMod, SPACE, togglesplit, # dwindle
# bind = $mainMod, SPACE, togglesplit, # dwindle
# bind = $mainMod, SPACE, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#-- Miscellaneous ----------------------------------------------
misc {
# https://wiki.hyprland.org/Configuring/Variables/#misc
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # disables the random hyprland logo / anime girl background. :(

	disable_splash_rendering = false
	#vfr = on
	vrr = 1
	mouse_move_enables_dpms = false
	always_follow_on_dnd = true
	layers_hog_keyboard_focus = true
	animate_manual_resizes = false
	disable_autoreload = false
    # enable_swallow = true
	enable_swallow = false
	#swallow_regex =
    swallow_regex = ^(kitty)$
#	no_direct_scanout = false
    # 禁用焦点跟随鼠标（可能导致点击问题）
    focus_on_activate = true
    mouse_move_focuses_monitor = false
}

#-- Binds ------------------------------------------------------
binds {
	pass_mouse_when_bound = false
	scroll_event_delay = 300
	workspace_back_and_forth = false
	allow_workspace_cycles = false
}

#-- Debug (Only for developers) --------------------------------
debug {
	overlay = false
	damage_blink = false
	disable_logs = false
	disable_time = true
	damage_tracking = 2
}

#-- Blurring Layer Surfaces ------------------------------------
#layerrule = "blur"
#layerrule = "blur"
#layerrule = "blur"
#layerrule = "blur"

#-- Output -----------------------------------------------------
# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = name, resolution, position, scale
# 0 -> normal (no transforms)
# 1 -> 90 degrees
# 2 -> 180 degrees
# 3 -> 270 degrees
# 4 -> flipped
# 5 -> flipped + 90 degrees
# 6 -> flipped + 180 degrees
# 7 -> flipped + 270 degrees
monitor=,preferred,auto,auto

#monitor = eDP-1,1920x1080@60,0x0,1
#monitor = eDP-1,addreserved,10,10,10,10
#monitor = DP-1,transform,3
#Monitor DP-1 (ID 0): 2560x1440@59.95100 at 0x0
#Monitor HDMI-A-2 (ID 1): 2560x1440@59.95100 at 4000x0
#Monitor DP-2 (ID 2): 2560x1440@60.00000 at 2560x0

#monitor = DP-1,transform,3
monitor = DP-1,transform,1
monitor = DP-2,transform,3
monitor = HDMI-A-2,transform,3

#monitorv2 {
#  output = DP-1
#  mode = 2560x1440@60
#  position = 0x0
#  scale = 1
#  transform = 1
#}
#monitorv2 {
#  output = DP-2
#  mode = 2560x1440@60
#  position = 1440x0
#  scale = 1
#  transform = 3
#}
#monitorv2 {
#  output = HDMI-A-2
#  mode = 2560x1440@60
#  position = 2880x0
#  scale = 1
#  transform = 0
#}
#workspace = eDP-1,1
#wsbind = 5,DP-1
#wsbind = name:secret,DP-2

#-- Layout : Dwindle -------------------------------------------
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this

	force_split = 0

	special_scale_factor = 0.8
	split_width_multiplier = 1.0
	#no_gaps_when_only = false
	#no_gaps_when_only = false
	#no_gaps_when_only = false
	use_active_for_splits = true
}

$notifycmd = notify-send -h string:x-canonical-private-synchronous:hypr-cfg -u low

bind = SUPER, G, togglegroup
bind = SUPER, G, exec, $notifycmd 'Toggled Group Mode'
bind = SUPER, H, changegroupactive, b
bind = SUPER, L, changegroupactive, f

